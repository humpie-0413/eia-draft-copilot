# ============================================================
# EIA Draft Copilot — CI 파이프라인
# PR 및 main 브랜치 push 시 자동 실행
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # 백엔드 테스트 (Python + PostgreSQL/PostGIS)
  # ----------------------------------------------------------
  backend-test:
    name: 백엔드 테스트
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: eia_copilot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 시스템 의존성 설치 (GDAL, GEOS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev gdal-bin

      - name: Python 패키지 설치
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Alembic 마이그레이션
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eia_copilot_test
        run: alembic upgrade head

      - name: 테스트 실행
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eia_copilot_test
          DATA_GO_KR_API_KEY: ""
          LLM_ADAPTER: none
        run: pytest tests/ -v --tb=short

  # ----------------------------------------------------------
  # 프론트엔드 빌드 + 린트
  # ----------------------------------------------------------
  frontend-build:
    name: 프론트엔드 빌드
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 빌드
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ----------------------------------------------------------
  # Docker 이미지 빌드 검증
  # ----------------------------------------------------------
  docker-build:
    name: Docker 빌드 검증
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose 설정 검증
        run: docker compose config

      - name: 백엔드 이미지 빌드
        run: docker build -t eia-backend:test ./backend

      - name: 프론트엔드 이미지 빌드
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: docker build -t eia-frontend:test .

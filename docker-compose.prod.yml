# ============================================================
# EIA Draft Copilot — 운영 환경 오버라이드
# 사용법: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:
  db:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필수 설정}
    # 운영 환경에서는 DB 포트를 외부에 노출하지 않음
    ports: []

  backend:
    restart: always
    environment:
      DEBUG: "false"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Nginx 리버스 프록시 (운영 전용)
  nginx:
    image: nginx:1.25-alpine
    container_name: eia-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - eia-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
